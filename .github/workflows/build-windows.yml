name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore SCFA.ContentCenter.sln
      - run: dotnet build SCFA.ContentCenter.sln -c Release --no-restore
      - run: dotnet publish src/SCFA.ContentCenter/SCFA.ContentCenter.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SCFA-ContentCenter-win-x64
          path: artifacts/win-x64/**
